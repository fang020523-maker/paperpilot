name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run
      - run: npm run build
        env:
          # 构建无需真实密钥（无密钥时自动进入离线降级链）
          ZHIPU_API_KEY: ""
